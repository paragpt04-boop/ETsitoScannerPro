name: Build Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Setup Windows project
        run: |
          flutter config --enable-windows-desktop
          flutter create --org com.jsus --project-name jsus_iptv --platforms=windows .
          git checkout lib/main.dart
          git checkout pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip output
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath JsusIPTV-Windows.zip

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: JsusIPTV-Windows
          path: JsusIPTV-Windows.zip
