name: Build APK Flutter

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Create Android project
        run: flutter create --project-name jsus_iptv --org com.jsus . --platforms android 2>/dev/null || true

      - name: Set App Name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="JsusIPTV"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Set App Icon
        run: |
          pip install Pillow --quiet
          python3 << 'PYEOF'
          from PIL import Image
          import os
          img = Image.open("android-icon/icon.png").convert("RGBA")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          base = "android/app/src/main/res"
          for folder, size in sizes.items():
            path = f"{base}/{folder}"
            os.makedirs(path, exist_ok=True)
            r = img.resize((size,size), Image.LANCZOS)
            r.save(f"{path}/ic_launcher.png")
            r.save(f"{path}/ic_launcher_round.png")
            print(f"OK {folder} {size}x{size}")
          PYEOF

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JsusIPTV
          path: build/app/outputs/flutter-apk/app-release.apk
