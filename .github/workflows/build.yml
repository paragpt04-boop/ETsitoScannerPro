name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Pillow
        run: pip install Pillow

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@4.8.1 @capacitor/cli@4.8.1 @capacitor/android@4.8.1

      - name: Init Capacitor
        run: |
          npx cap init JsusIPTV com.jsus.iptv --web-dir www
          npx cap add android
          npx cap copy android

      - name: Set App Icon
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os

          src = "android-icon/icon.png"
          img = Image.open(src).convert("RGBA")

          sizes = {
            "mdpi": 48,
            "hdpi": 72,
            "xhdpi": 96,
            "xxhdpi": 144,
            "xxxhdpi": 192
          }

          for folder, size in sizes.items():
            path = f"android/app/src/main/res/mipmap-{folder}"
            os.makedirs(path, exist_ok=True)
            resized = img.resize((size, size), Image.LANCZOS)
            resized.save(f"{path}/ic_launcher.png")
            resized.save(f"{path}/ic_launcher_round.png")
            print(f"✓ {folder} {size}x{size}")
          PYEOF

      - name: Set App Name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="JsusIPTV"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JsusIPTV
          path: android/app/build/outputs/apk/debug/app-debug.apk
